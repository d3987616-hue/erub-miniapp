<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #log { margin-top: 10px; padding: 10px; background: #1e1e1e; color: #00ff00; border-radius: 5px; font-size: 12px; font-family: monospace; max-height: 200px; overflow-y: auto; }
        .status { margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🔑 Тест входа</h1>
    <input type="email" id="email" placeholder="Email" value="test@test.com">
    <input type="password" id="password" placeholder="Пароль" value="1234">
    <button onclick="sendData()">📤 Отправить</button>
    <div id="status" class="status">⏳ Ожидание...</div>
    <div id="log"></div>
    
    <script>
        // Инициализация
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const logDiv = document.getElementById('log');
        const statusDiv = document.getElementById('status');
        
        function addLog(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div style="color: ${isError ? '#ff4444' : '#00ff00'}">[${time}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        addLog('✅ Telegram WebApp инициализирован');
        addLog(`👤 User ID: ${tg.initDataUnsafe?.user?.id || 'неизвестен'}`);
        
        function sendData() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            addLog(`📤 Отправка данных...`);
            addLog(`📧 Email: ${email}`);
            addLog(`🔑 Пароль: ${password ? '****' : 'пусто'}`);
            
            if (!email || !password) {
                statusDiv.innerHTML = '❌ Заполните все поля!';
                addLog('❌ Ошибка: поля не заполнены', true);
                return;
            }
            
            const data = { email: email, password: password };
            const jsonData = JSON.stringify(data);
            addLog(`📦 JSON: ${jsonData}`);
            
            try {
                // ПЕРВЫЙ СПОСОБ: через sendData
                if (typeof tg.sendData === 'function') {
                    tg.sendData(jsonData);
                    addLog('✅ Отправлено через tg.sendData()');
                    statusDiv.innerHTML = '✅ Данные отправлены!';
                }
                
                // ВТОРОЙ СПОСОБ: через postMessage (для некоторых версий Telegram)
                if (window.parent) {
                    window.parent.postMessage(JSON.stringify({
                        event: 'sendData',
                        data: jsonData
                    }), '*');
                    addLog('✅ Отправлено через postMessage');
                }
                
                // ТРЕТИЙ СПОСОБ: через WebApp.sendData (альтернативный синтаксис)
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.sendData) {
                    window.Telegram.WebApp.sendData(jsonData);
                    addLog('✅ Отправлено через WebApp.sendData()');
                }
                
                // ЧЕТВЕРТЫЙ СПОСОБ: через MainButton (если есть)
                tg.MainButton.setText('Отправлено');
                tg.MainButton.show();
                
                statusDiv.innerHTML = '✅ Данные отправлены всеми способами!';
                
            } catch (error) {
                addLog(`❌ Ошибка: ${error.message}`, true);
                statusDiv.innerHTML = `❌ Ошибка: ${error.message}`;
            }
        }
        
        // Отправка по Enter
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendData();
        });
    </script>
</body>
</html>
