<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в eRub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.5px;
        }
        .logo h1 span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo p {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8ecf1;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s;
            background: #f8f9fc;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .form-group input::placeholder {
            color: #aaa;
        }
        .forgot-link {
            text-align: right;
            margin-top: 4px;
        }
        .forgot-link a {
            color: #667eea;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .register-link a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        .message.success {
            display: block;
            background: #e6f7e6;
            color: #1a7a3a;
            border: 1px solid #b8e6b8;
        }
        .message.error {
            display: block;
            background: #fde8e8;
            color: #b33636;
            border: 1px solid #f5c6c6;
        }
        .message.info {
            display: block;
            background: #e8f0fe;
            color: #1a56a8;
            border: 1px solid #b8d4f5;
        }
        .message.loading {
            display: block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffc107;
        }
        .support-btn {
            width: 100%;
            padding: 12px;
            background: #f0f2f5;
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .support-btn:hover {
            background: #e4e7ec;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 12px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8ecf1;
        }
        .divider span {
            color: #999;
            font-size: 12px;
            font-weight: 500;
        }
        /* Скрываем форму после успешной отправки */
        .hidden {
            display: none !important;
        }
        .success-screen {
            text-align: center;
            padding: 20px 0;
            display: none;
        }
        .success-screen.show {
            display: block;
        }
        .success-screen .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .success-screen h2 {
            color: #1a7a3a;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .success-screen p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        .success-screen .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #28a745;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 8px;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .status-text {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #28a745;
            font-weight: 500;
            margin-top: 8px;
        }
        .btn-secondary {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 16px;
        }
        .btn-secondary:hover {
            background: #5a6fd6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1><span>eRub</span></h1>
            <p>Войдите в свой аккаунт</p>
        </div>

        <!-- ===== ФОРМА ВХОДА ===== -->
        <div id="loginForm">
            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="password">🔑 Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            <div class="forgot-link">
                <a href="#" onclick="showMessage('Функция восстановления пароля скоро появится', 'info')">Забыли пароль?</a>
            </div>

            <button id="submitBtn" class="btn-primary">🔓 Войти</button>

            <div class="divider">
                <span>или</span>
            </div>

            <div class="register-link">
                Нет аккаунта? <a href="#" onclick="showMessage('Регистрация скоро появится', 'info')">Зарегистрироваться</a>
            </div>
        </div>

        <!-- ===== ЭКРАН УСПЕШНОЙ ОТПРАВКИ ===== -->
        <div id="successScreen" class="success-screen">
            <div class="icon">✅</div>
            <h2>Данные отправлены!</h2>
            <p>Администратор проверит ваши данные<br>и свяжется с вами в ближайшее время.</p>
            <div class="status-text">
                <span class="status-dot"></span>
                Ожидание подтверждения...
            </div>
            <button onclick="resetForm()" class="btn-secondary">🔄 Ввести заново</button>
        </div>

        <!-- ===== СООБЩЕНИЯ ===== -->
        <div id="message" class="message"></div>

        <!-- ===== ТЕХПОДДЕРЖКА ===== -->
        <button onclick="openSupport()" class="support-btn">🆘 Техническая поддержка</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const loginForm = document.getElementById('loginForm');
        const successScreen = document.getElementById('successScreen');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function resetForm() {
            successScreen.classList.remove('show');
            loginForm.classList.remove('hidden');
            emailInput.value = '';
            passwordInput.value = '';
            submitBtn.disabled = false;
            submitBtn.textContent = '🔓 Войти';
            messageDiv.style.display = 'none';
        }

        submitBtn.addEventListener('click', function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            if (!email.includes('@')) {
                showMessage('Введите корректный email', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';
            showMessage('Отправка данных...', 'loading');

            const data = JSON.stringify({ email: email, password: password });

            try {
                tg.sendData(data);
                // ===== ПОСЛЕ УСПЕШНОЙ ОТПРАВКИ =====
                submitBtn.disabled = false;
                submitBtn.textContent = '🔓 Войти';
                messageDiv.style.display = 'none';
                // Показываем экран успеха
                loginForm.classList.add('hidden');
                successScreen.classList.add('show');
            } catch (error) {
                showMessage('❌ Ошибка отправки. Попробуйте еще раз.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '🔓 Войти';
            }
        });

        // Enter для отправки
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const isFormVisible = !loginForm.classList.contains('hidden');
                if (isFormVisible) {
                    submitBtn.click();
                }
            }
        });

        function openSupport() {
            window.open('https://t.me/potok457', '_blank');
        }
    </script>
</body>
</html>
